<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Технические работы — SakhGO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.12), transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(168,85,247,0.08), transparent 50%);
  }
  .card {
    position: relative;
    max-width: 500px;
    width: 90%;
    text-align: center;
    padding: 48px 32px;
  }
  .icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 32px;
    font-size: 36px;
    box-shadow: 0 0 60px rgba(59,130,246,0.3);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(59,130,246,0.2); }
    50% { box-shadow: 0 0 80px rgba(99,102,241,0.4); }
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
  p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
  .progress-bar {
    height: 4px;
    background: rgba(148,163,184,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin: 0 auto 32px;
    max-width: 280px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 2px;
    animation: progress 2s ease-in-out infinite;
    width: 30%;
  }
  @keyframes progress {
    0% { width: 10%; margin-left: 0; }
    50% { width: 40%; margin-left: 30%; }
    100% { width: 10%; margin-left: 90%; }
  }
  .footer { color: #475569; font-size: 13px; }
  .footer a { color: #6366f1; text-decoration: none; }
  .dots { display: inline-flex; gap: 6px; margin-left: 4px; }
  .dots span {
    width: 5px; height: 5px;
    background: #6366f1;
    border-radius: 50%;
    animation: dot 1.4s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="card">
  <div class="icon">🛠️</div>
  <h1>Технические работы</h1>
  <p>
    Мы обновляем SakhGO чтобы сделать его ещё лучше.
    Это займёт всего несколько минут<span class="dots"><span></span><span></span><span></span></span>
  </p>
  <div class="progress-bar"><div class="progress-fill"></div></div>
  <div class="footer">
    Попробуйте обновить страницу через минуту<br>
    <a href="/">sakhgo.ru</a> — Сахалинская доска объявлений
  </div>
</div>
</body>
</html>
