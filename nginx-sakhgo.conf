server {
    server_name sakhgo.ru www.sakhgo.ru;
    client_max_body_size 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.vk.com https://yoomoney.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SEO files — serve directly, bypass Next.js
    location = /robots.txt {
        root /home/alex/sakhgo/public;
        add_header Content-Type text/plain;
    }
    location = /sitemap.xml {
        root /home/alex/sakhgo/public;
        add_header Content-Type application/xml;
    }

    # Maintenance mode check
    set $maintenance 0;
    if (-f /home/alex/sakhgo/maintenance.flag) {
        set $maintenance 1;
    }
    if ($request_uri ~ ^/(api|uploads)/) {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /home/alex/sakhgo/public;
    }

    location /api/ {
        limit_req zone=sakhgo_api burst=15 nodelay;
        limit_req_log_level warn;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        root /home/alex/sakhgo/public;
    }

    # Proxy _next requests to Next.js (handles static + RSC)
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/sakhgo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sakhgo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.sakhgo.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = sakhgo.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name sakhgo.ru www.sakhgo.ru;
    return 404;
}